<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactos — MTNA</title>
    <meta name="description" content="Entre em contacto com Maria Teresa." />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background:
          linear-gradient(rgba(3, 10, 7, 0.82), rgba(3, 10, 7, 0.82)),
          url("MTNAimagens/Bloglog.jpg") center center / cover no-repeat fixed;
        color: #d9ddda;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Fundo desfocado + escurecido */
      .contactos-fundo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(3, 10, 7, 0.28);
        pointer-events: none;
        z-index: 0;
      }

      /* HEADER */
      .mtna-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #2a3431;
        padding: 55px 0;
        z-index: 2;
        border-bottom: 4px solid #020b07;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .mtna-nav {
        display: flex;
        justify-content: center;
        gap: 0.5px;
        flex-wrap: wrap;
      }

      .mtna-nav a {
        text-decoration: none;
        font-size: 1.2rem;
        color: #fff;
        font-weight: bold;
        padding: 10px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .mtna-nav a:hover,
      .mtna-nav a.active {
        background: #729b52;
        transform: scale(1.05);
        padding-left: 20px;
        padding-right: 20px;
        box-shadow: 0 4px 12px rgba(114, 155, 82, 0.4);
      }

      /* CONTEÚDO */
      .mtna-main {
        flex: 1;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-top: 140px;
        position: relative;
        z-index: 1;
      }

      .mtna-main h1 {
        text-align: center;
        font-size: 3.5rem;
        margin: 30px 0;
        color: #ffffff;
      }

      .contactos {
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
      }

      .contactos ul {
        list-style: none;
        padding: 0;
      }

      .contactos li {
        padding: 10px 0;
        font-size: 1.1rem;
      }

      .contactos a {
        color: #729b52;
        font-weight: bold;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .contactos a:hover {
        color: #8adf7d;
        text-decoration: underline;
      }

      /* FORMULÁRIO */
      .formulario-contacto {
        max-width: 600px;
        margin: 20px auto 60px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: rgba(1, 23, 16, 0.92);
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 1);
        border: 2px solid #020b07;
      }

      .formulario-contacto label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: bold;
        color: #ffffff;
      }

      .formulario-contacto input,
      .formulario-contacto textarea {
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #729b52;
        background: #205320;
        color: #ffffff;
      }

      .formulario-contacto button {
        background: #729b52;
        color: #f0ebeb;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .formulario-contacto button:hover {
        background: #8adf7d;
      }

      /* FOOTER */
      .mtna-footer {
        background: #2a3431;
        color: #fff;
        text-align: center;
        padding: 20px;
        border-top: 5px solid #020b07;
      }
    </style>
  </head>
  <script src="scriptmtna.js"></script>

  <body>
    <div class="contactos-fundo"></div>

    <header class="mtna-header">
      <nav class="mtna-nav">
        <a href="index.html">Início</a>
        <a href="blogmtna.html">Blogue</a>
        <a href="galmtna.html">Galeria</a>
        <a href="sobrmtna.html">Sobre Mim</a>
        <a class="active" href="contmtna.html">Contactos</a>
      </nav>
    </header>

    <main class="mtna-main">
      <h1>Contactos</h1>
      <p style="text-align: center">
        Entre em contacto comigo através dos meios abaixo ou pelo formulário.
      </p>

      <section class="contactos">
        <h2>Os meus contactos</h2>
        <ul>
          <li><strong>Telemóvel:</strong> 963 319 416</li>
          <li>
            <strong>Email:</strong>
            <a href="mailto:mtna20100922@gmail.com">mtna20100922@gmail.com</a>
          </li>
        </ul>
      </section>

      <form id="formulario-contacto" class="formulario-contacto">
        <label>Nome <input type="text" name="nome" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <label
          >Mensagem <textarea name="mensagem" rows="5" required></textarea>
        </label>
        <button type="submit">Enviar</button>
      </form>
    </main>

    <footer class="mtna-footer">
      &copy; 2026 MTNA Blogue — Criado por Maria Teresa.para partilhar ideias,
      experiências e inspiração
    </footer>
  </body>
</html>
