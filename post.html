<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post — MTNA</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0f3d2e;
        color: #e9ebe9;
        font-family: Arial, Helvetica, sans-serif;
      }

      .conteudo {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        font-size: 2.4rem;
        margin-bottom: 10px;
      }

      .categoria {
        font-size: 1.1rem;
        color: #8bc06a;
        margin-bottom: 20px;
      }

      .data {
        font-size: 0.9rem;
        color: #b0b5b0;
        margin-bottom: 30px;
      }

      img {
        max-width: 100%;
        border-radius: 8px;
        margin-bottom: 30px;
      }

      p {
        font-size: 1.2rem;
        line-height: 1.6;
      }

      a.voltar {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 20px;
        background: #729b52;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <main class="conteudo">
      <h1 id="titulo"></h1>
      <div class="categoria" id="categoria"></div>
      <div class="data" id="data"></div>
      <img id="imagem" style="display: none" />
      <p id="conteudo"></p>

      <a href="blogmtna.html" class="voltar">← Voltar ao Blog</a>
    </main>

    <script src="post.js"></script>
  </body>
</html>
