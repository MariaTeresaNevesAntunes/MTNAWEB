<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início — MTNA Blogue</title>
    <meta name="description" content="Bem-vindos ao blogue de Maria Teresa." />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background:
          url("MTNAimagens/Bloglog.jpg") center center / cover no-repeat fixed,
          #0f3d2e;
        color: #d9ddda;
        font-family: Arial, Helvetica, sans-serif;
      }
      .mtna-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #2a3431;
        padding: 55px 0;
        z-index: 2;
        border-bottom: 4px solid #020b07;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .mtna-nav {
        display: flex;
        justify-content: center;
        gap: 0.5px;
        flex-wrap: wrap;
      }
      .mtna-nav a {
        text-decoration: none;
        font-size: 1.2rem;
        color: #fff;
        font-weight: bold;
        padding: 10px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
      }
      .mtna-nav a:hover,
      .mtna-nav a.active {
        background: #729b52;
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(114, 155, 82, 0.4);
      }
      .mtna-main {
        flex: 1;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding-top: 120px;
      }
      .home-hero {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .home-hero p {
        font-family: "Alfa Slab One", serif;
        font-size: clamp(1rem, 2.5vw, 1.6rem);
        font-weight: 400;
        color: #d4ddd4;
        text-align: center;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        letter-spacing: 0.12em;
        line-height: 1.3;
        padding: 0 20px;
        margin: 0;
        margin-top: 80px;
        text-transform: uppercase;
      }

      .mtna-footer {
        display: flex;
        justify-content: center;
        background: #2a3431;
        color: #fff;
        text-align: center;
        padding: 20px;
        font-size: 16px;
        border-top: 5px solid #020b07;
        width: 100%;
      }

      @media (max-width: 760px) {
        .mtna-header {
          padding: 16px 0;
        }

        .mtna-nav {
          gap: 8px;
          padding: 0 12px;
        }

        .mtna-nav a {
          font-size: 0.95rem;
          padding: 8px 12px;
        }

        .mtna-main {
          padding-top: 150px;
        }

        .home-hero {
          min-height: 58vh;
        }

        .home-hero p {
          margin-top: 24px;
          letter-spacing: 0.08em;
        }

        .mtna-footer {
          padding: 16px 14px;
          font-size: 0.92rem;
        }
      }

      @media (max-width: 480px) {
        .mtna-header {
          padding: 12px 0;
        }

        .mtna-nav {
          gap: 6px;
        }

        .mtna-nav a {
          font-size: 0.88rem;
          padding: 7px 10px;
        }

        .mtna-main {
          padding-top: 164px;
        }

        .home-hero {
          min-height: 52vh;
        }

        .home-hero p {
          padding: 0 14px;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="mtna-header">
      <nav class="mtna-nav">
        <a href="index.html">Início</a>
        <a href="blogmtna.html">Blogue</a>
        <a href="aplimat.html"><strong>Apps Matemática</strong></a>
        <a href="aplidiv.html">Apps Diversos</a>
        <a href="galmtna.html">Galeria</a>
        <a href="sobrmtna.html">Sobre Mim</a>
        <a href="contmtna.html">Contactos</a>
      </nav>
    </header>
    <main class="mtna-main">
      <div class="home-hero">
        <p></p>
      </div>
    </main>
    <footer class="mtna-footer">
      <p>
        &copy; 2026 MTNA Blogue — Criado por Maria Teresa para partilhar ideias,
        experiências e inspiração.
      </p>
    </footer>
    <script src="scriptmtna.js"></script>
  </body>
</html>
