<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogue — MTNA</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: linear-gradient(135deg, #3e4d3d, #171e1c, #222b25);
        background-attachment: fixed;
        color: #d9ddda;
        font-family: Arial, Helvetica, sans-serif;
      }
      .cabecalho {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #2a3431;
        padding: 55px 0;
        z-index: 2;
        border-bottom: 4px solid #020b07;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .menu {
        display: flex;
        justify-content: center;
        gap: 0.5px;
        flex-wrap: wrap;
      }
      .menu a {
        text-decoration: none;
        font-size: 1.2rem;
        color: #fff;
        font-weight: bold;
        padding: 10px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .menu a:hover,
      .menu a.ativo {
        background: #729b52;
        transform: scale(1.05);
      }
      .conteudo {
        flex: 1;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 140px 20px 40px;
      }
      h1 {
        text-align: center;
        font-size: 2.5rem;
        margin: 20px 0;
        color: #e9ebe9;
      }
      .intro {
        text-align: center;
        font-size: 1.1rem;
        color: #b0b5b0;
        margin-bottom: 30px;
      }
      .blog-filtros {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 30px 0;
        padding: 20px;
      }
      .blog-filtros button {
        background: #1a5a3e;
        color: #fff;
        border: 2px solid #729b52;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      .blog-filtros button:hover,
      .blog-filtros button.ativo {
        background: #729b52;
        border-color: #e9ebe9;
        transform: scale(1.05);
      }
      #lista-publica {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .post {
        background: rgba(15, 61, 46, 0.7);
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid #729b52;
        transition: all 0.3s ease;
      }
      .post:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }
      .paginacao {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 30px;
      }
      .paginacao button {
        background: #1a5a3e;
        color: #fff;
        border: 2px solid #729b52;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }
      .paginacao button:hover {
        background: #729b52;
      }
      .rodape {
        display: flex;
        justify-content: center;
        background: #2a3431;
        color: #fff;
        text-align: center;
        padding: 20px;
        font-size: 16px;
        border-top: 5px solid #020b07;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <header class="cabecalho">
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="blogmtna.html" class="ativo">Blogue</a>
        <a href="aplimat.html">Apps Matemática</a>
         <a href="aplidiv.html">Apps Diversos</a>
        <a href="galmtna.html">Galeria</a>
        <a href="sobrmtna.html">Sobre Mim</a>
        <a href="contmtna.html">Contactos</a>
      </nav>
    </header>

    <main class="conteudo">
      <h1>Explicações & Tópicos de Matemática</h1>
      <p class="intro">
        Onde a precisão do cálculo encontra a elegância do design.
      </p>

      <!-- ACESSO ADMIN -->
      <div id="admin-acesso" style="text-align: right; margin-bottom: 20px">
        <input
          id="codigo-admin"
          type="password"
          placeholder="Código admin"
          style="padding: 6px; border-radius: 4px; border: none"
        />
        <button
          onclick="verificarAdmin()"
          style="
            padding: 6px 12px;
            background: #729b52;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          Entrar
        </button>
      </div>

      <!-- BOTÃO ADMIN (ESCONDIDO ATÉ VALIDAR) -->
      <div
        id="botao-admin"
        style="display: none; text-align: right; margin-bottom: 20px"
      >
        <a
          href="blog-admin.html"
          style="
            background: #729b52;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
          "
        >
          Painel de Administração
        </a>

        <button
          onclick="sairAdmin()"
          style="
            margin-left: 10px;
            padding: 10px 20px;
            background: #b33a3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
          "
        >
          Sair
        </button>
      </div>

      <section class="blog-filtros">
        <button class="ativo" data-filtro="todos">📚 Todos</button>
        <button data-filtro="Geometria">📐 Geometria</button>
        <button data-filtro="Álgebra">f(x) Álgebra</button>
      </section>

      <section id="lista-publica"></section>

      <div class="paginacao" id="paginacao"></div>
    </main>

    <footer class="rodape">
      <p>
        © 2026 MTNA - Criado por Maria Teresa para partilhar ideias,
        experiências e inspiração.
      </p>
    </footer>

    <script>
      const CODIGO_ADMIN = "mtna2026";

      window.onload = function () {
        const adminAtivo = localStorage.getItem("admin");
        if (adminAtivo === "true") {
          mostrarPainelAdmin();
        } else {
          esconderPainelAdmin();
        }
      };

      function verificarAdmin() {
        const codigo = document.getElementById("codigo-admin").value;
        if (codigo === CODIGO_ADMIN) {
          localStorage.setItem("admin", "true");
          mostrarPainelAdmin();
        }
      }

      function mostrarPainelAdmin() {
        document.getElementById("admin-acesso").style.display = "none";
        document.getElementById("botao-admin").style.display = "block";
      }

      function esconderPainelAdmin() {
        document.getElementById("admin-acesso").style.display = "block";
        document.getElementById("botao-admin").style.display = "none";
      }

      function sairAdmin() {
        localStorage.removeItem("admin");
        esconderPainelAdmin();
      }
    </script>

    <script src="public.js"></script>
  </body>
</html>
