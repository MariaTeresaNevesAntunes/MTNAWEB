<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Painel de Administração — MTNA</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Painel de Administração — MTNA Blogue</h1>

    <!-- =============================== -->
    <!--  POSTS — CRIAR                 -->
    <!-- =============================== -->
    <section class="admin-section">
      <h2>📝 Criar Post</h2>

      <form id="form-post">
        <label>Título:</label>
        <input type="text" id="post-titulo" required />

        <label>Categoria:</label>
        <input type="text" id="post-categoria" required />

        <label>Conteúdo:</label>
        <textarea id="post-conteudo" required></textarea>

        <label>Data (aaaa-mm-dd):</label>
        <input type="date" id="post-data" required />

        <label>Imagem (URL opcional):</label>
        <input type="text" id="post-imagem" />

        <button type="submit">Criar Post</button>
      </form>
    </section>

    <!-- =============================== -->
    <!--  POSTS — LISTA                 -->
    <!-- =============================== -->
    <section class="admin-section">
      <h2>📚 Lista de Posts</h2>
      <div id="lista-posts" class="lista-admin"></div>
    </section>

    <!-- =============================== -->
    <!--  TÓPICOS — CRIAR               -->
    <!-- =============================== -->
    <section class="admin-section">
      <h2>📘 Criar Tópico</h2>

      <form id="form-topico">
        <label>Título:</label>
        <input type="text" id="topico-titulo" required />

        <label>Categoria:</label>
        <input type="text" id="topico-categoria" required />

        <label>Descrição:</label>
        <textarea id="topico-descricao" required></textarea>

        <label>Nível:</label>
        <select id="topico-nivel">
          <option>Iniciante</option>
          <option>Intermédio</option>
          <option>Avançado</option>
        </select>

        <button type="submit">Criar Tópico</button>
      </form>
    </section>

    <!-- =============================== -->
    <!--  TÓPICOS — LISTA               -->
    <!-- =============================== -->
    <section class="admin-section">
      <h2>📗 Lista de Tópicos</h2>
      <div id="lista-topicos" class="lista-admin"></div>
    </section>

    <!-- =============================== -->
    <!--  CONTACTOS — LISTA             -->
    <!-- =============================== -->
    <section class="admin-section">
      <h2>📩 Lista de Contactos</h2>
      <div id="lista-contactos" class="lista-admin"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
