<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicativos Diversos — MTNA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #3e4d3d, #171e1c, #222b25);
      color: #d9ddda;
    }

    .cabecalho {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #2a3431;
      padding: 55px 0;
      z-index: 2;
      border-bottom: 4px solid #020b07;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .cabecalho nav a {
      color: #d9ddda;
      margin: 0 15px;
      text-decoration: none;
      font-size: 18px;
    }

    .cabecalho nav a.ativo {
      font-weight: bold;
      text-decoration: underline;
    }

    main.conteudo {
      max-width: 1000px;
      margin: 180px auto 50px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .app-card {
      background: #2a3431;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .app-card h2 {
      margin-top: 0;
    }

    .app-info {
      margin-bottom: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
    }

    .fallback {
      margin-top: 15px;
      padding: 12px;
      background: #394640;
      border-radius: 8px;
      font-size: 14px;
    }

    .fallback button {
      margin-top: 8px;
      padding: 8px 16px;
      background: #729b52;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .fallback button:hover {
      background: #88b766;
    }
  </style>
</head>

<body>

  <header class="cabecalho">
    <nav>
      <a href="index.html">Início</a>
      <a href="blogmtna.html">Blogue</a>
      <a href="aplimat.html">Apps Matemática</a>
      <a href="aplidiv.html" class="ativo">Apps Diversos</a>
      <a href="galeria.html">Galeria</a>
      <a href="sobre.html">Sobre Mim</a>
      <a href="contactos.html">Contactos</a>
    </nav>
  </header>

  <main class="conteudo">
    <h1>Aplicativos Diversos</h1>

    <!-- Quintal pra Mesa (não funciona em iframe) -->
    <div class="app-card">
      <h2>Quintal pra Mesa</h2>
      <p class="app-info">
        Este site não permite ser carregado dentro de outro site (iframe).
      </p>
      <div class="fallback">
        <div>Para usar o Quintal pra Mesa, abre numa nova aba:</div>
        <button onclick="window.open('https://quintal-pra-mesa-redesign.lovable.app', '_blank')">
          Abrir Quintal pra Mesa
        </button>
      </div>
    </div>
 <!-- PulseCount -->
    <div class="app-card">
      <h2>PulseCount</h2>
      <iframe src="https://pulse-count.lovable.app"></iframe>
    </div>

  </main>

</body>
</html>
