    font-family: "Alfa Slab One", serif;
    font-size: clamp(1rem, 2.5vw, 1.6rem); font-weight: 400;
    color: #d4ddd4; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    letter-spacing: 0.12em; line-height: 1.3;
    padding: 0 20px; margin: 0; margin-top: 80px; text-transform: uppercase;
  }
